name: NIVAR Validation

on:
  push:
    branches: ["main", "semantic-extraction-rewrite"]
  pull_request:
    branches: ["main"]

jobs:
  backend-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas
      - name: Run extraction regressions
        run: pytest -q tests/test_extraction_regressions.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
